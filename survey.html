<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>栖 ROOST · 冥想App界面偏好调研</title>
<style>
  :root{
    --bg:#f3f1e8; --card:#fbfaf4; --ink:#3a443c; --sub:#7a857c;
    --green:#5c8766; --green-d:#4a6f53; --green-l:#e7efe8; --line:#e3e6dc;
    --accent:#6e8f7b; --warn:#b0846a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eef0e6 0%,#f3f1e8 240px);color:var(--ink);line-height:1.6;}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 120px;}
  header.top{text-align:center;padding:34px 10px 18px;}
  .logo{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--green-d);letter-spacing:2px;margin-bottom:10px;}
  .logo .dot{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a9c9b2,#5c8766);display:inline-block;}
  h1{font-size:22px;margin:6px 0 8px;color:var(--green-d);font-weight:700;letter-spacing:1px;}
  .lead{font-size:13.5px;color:var(--sub);margin:0 auto;max-width:520px;}
  .tabs{display:flex;gap:10px;margin:18px 0 6px;position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,rgba(243,241,232,.98),rgba(243,241,232,.9));backdrop-filter:blur(6px);}
  .tab{flex:1;padding:13px 8px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);
    text-align:center;cursor:pointer;transition:.2s;font-size:14px;color:var(--sub);font-weight:600;}
  .tab small{display:block;font-weight:400;font-size:11px;margin-top:2px;opacity:.8;}
  .tab.active{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 16px rgba(92,135,102,.3);}
  .form-intro{background:var(--green-l);border:1px solid #d7e3d9;border-radius:16px;padding:16px 18px;margin:14px 0 20px;font-size:13.5px;color:#43524a;}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
  .compare .cc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:12.5px;}
  .compare .cc b{display:block;color:var(--green-d);font-size:14px;margin-bottom:6px;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(90,110,90,.04);}
  .qcard.req-miss{border-color:var(--warn);box-shadow:0 0 0 2px rgba(176,132,106,.15);}
  .qtitle{font-size:15.5px;font-weight:600;margin-bottom:4px;line-height:1.55;}
  .qno{color:var(--green);font-weight:700;margin-right:6px;}
  .qmeta{font-size:11.5px;color:var(--sub);margin-bottom:12px;}
  .qmeta .req{color:var(--warn);}
  .opts{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;
    cursor:pointer;font-size:14px;transition:.15s;background:#fff;}
  .opt:active{transform:scale(.99);}
  .opt.sel{border-color:var(--green);background:var(--green-l);}
  .box{width:20px;height:20px;border:2px solid #c2cbbc;border-radius:50%;flex:0 0 20px;margin-top:1px;position:relative;transition:.15s;}
  .box.sq{border-radius:6px;}
  .opt.sel .box{border-color:var(--green);background:var(--green);}
  .box::after{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;transition:.15s;}
  .box.sq::after{border-radius:2px;left:4px;top:4px;width:10px;height:10px;}
  .opt.sel .box::after{opacity:1;}
  .opt .ot{flex:1;}
  .opt input.fillin{border:none;border-bottom:1px solid #cfd4c8;background:transparent;outline:none;font-size:13.5px;width:120px;color:var(--ink);}
  /* scale */
  .scale{display:flex;justify-content:space-between;gap:6px;margin:8px 0 4px;}
  .scale .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
  .scale .n{width:38px;height:38px;border-radius:50%;border:1.5px solid #c9cec2;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600;color:var(--sub);background:#fff;transition:.15s;}
  .scale .s.sel .n{background:var(--green);border-color:var(--green);color:#fff;}
  .scale-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:2px;}
  /* matrix */
  .matrix{width:100%;border-collapse:collapse;font-size:13px;}
  .matrix th{font-weight:500;color:var(--sub);font-size:11px;padding:4px 2px;text-align:center;}
  .matrix th:first-child,.matrix td:first-child{text-align:left;}
  .matrix td{padding:7px 2px;border-top:1px solid var(--line);text-align:center;}
  .matrix td:first-child{font-size:13px;padding-right:6px;}
  .mbtn{width:22px;height:22px;border-radius:50%;border:1.6px solid #c9cec2;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;}
  .mbtn.sel{background:var(--green);border-color:var(--green);}
  .mbtn.sel::after{content:"✓";color:#fff;font-size:12px;}
  .matrix-wrap{overflow-x:auto;}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;
    background:#fff;resize:vertical;min-height:64px;outline:none;color:var(--ink);}
  textarea:focus{border-color:var(--green);}
  .underline{border:none;border-bottom:1.5px solid #cfd4c8;background:transparent;outline:none;font-size:14px;min-width:100px;}
  .submitbar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,250,244,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30;}
  .submit-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .pbar{flex:1;height:8px;background:#e4e7dd;border-radius:5px;overflow:hidden;}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fa889,#5c8766);transition:width .3s;border-radius:5px;}
  .ptext{font-size:12px;color:var(--sub);white-space:nowrap;}
  .btn{background:var(--green);color:#fff;border:none;border-radius:13px;padding:13px 26px;font-size:15.5px;font-weight:600;cursor:pointer;
    box-shadow:0 6px 16px rgba(92,135,102,.3);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff;color:var(--green-d);border:1.5px solid var(--green);box-shadow:none;}
  .sec-h{font-size:13px;color:var(--green-d);font-weight:700;letter-spacing:1px;margin:22px 4px 10px;}
  .thanks{text-align:center;padding:50px 20px;}
  .thanks .big{font-size:52px;margin-bottom:10px;}
  .thanks h2{color:var(--green-d);margin:8px 0;}
  .thanks p{color:var(--sub);font-size:14px;}
  .copybox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;font-size:12px;
    color:var(--sub);max-height:180px;overflow:auto;white-space:pre-wrap;margin:14px 0;word-break:break-all;}
  .hidden{display:none;}
  .tip{font-size:11.5px;color:var(--sub);margin-top:6px;}
  .missing-tip{color:var(--warn);font-size:12.5px;text-align:center;margin:0 0 10px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="dot"></span>栖 ROOST</div>
    <h1>冥想 App 界面偏好调研</h1>
    <p class="lead">想了解你更偏好「极简」还是「功能丰富」的冥想 App。匿名填写，约 5–7 分钟，答案没有对错，凭真实感受即可。</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-form="a" onclick="switchForm('a')">问卷一<small>通用偏好</small></div>
    <div class="tab" data-form="b" onclick="switchForm('b')">问卷二<small>「栖」改版取舍</small></div>
  </div>

  <div id="formA"></div>
  <div id="formB" class="hidden"></div>
  <div id="doneA" class="hidden"></div>
  <div id="doneB" class="hidden"></div>
</div>

<div class="submitbar" id="submitbar">
  <div class="missing-tip" id="missingTip">还有必答题未完成，已为你定位到最前面的一题</div>
  <div class="submit-inner">
    <div class="pbar"><i id="pbar"></i></div>
    <div class="ptext" id="ptext">0%</div>
    <button class="btn" id="submitBtn" onclick="submitForm()">提交</button>
  </div>
</div>

const FORMS={
a:{

   {id:"A8",t:"以下三种首页风格，你更偏好哪一种？",type:"single",

   {id:"B13",t:"你对「30 天系统课程」的态度是？",type:"single",o:["是核心价值，应当保留","有压力，希望成为可选项","希望改成更短的（如 7 天）","不太需要"]},
   {id:"B14",t:"你对「声音花园 / 混音工作台」的态度是？",type:"single",o:["是核心亮点，保留","锦上添花，可保留","偏复杂，希望更简单","基本不会用"]},
   {id:"B15",t:"在背景音 / 声音上，你希望的自定义程度是？",type:"single",o:["越简单越好，给我默认的就行","提供几个精选预设即可","希望能自由混合、调节各种声音"]},
  ]},
  {h:"三、改版后的使用意愿",qs:[
   {id:"B16",t:"如果「栖」的界面变得更简洁，你继续使用的可能性是？",type:"scale",l:"几乎不会",r:"一定会"},
   {id:"B17",t:"如果「栖」保持现在的丰富程度，你继续使用的可能性是？",type:"scale",l:"几乎不会",r:"一定会"},
   {id:"B18",t:"如果只允许改动一个地方，你最希望「栖」改哪里？",type:"open",req:false},
   {id:"B19",t:"你觉得「栖」最打动你、最应该保留的是什么？",type:"open",req:false},
  ]},
  {h:"四、基本信息",qs:[
   {id:"B20",t:"你是否使用过当前版本的「栖 ROOST」？",type:"single",o:["完整使用过","简单体验过","没有，只看了本问卷的介绍"]},
   {id:"B21",t:"你的性别？",type:"single",o:GENDER},
   {id:"B22",t:"你的年龄段？",type:"single",o:AGE},
   {id:"B23",t:"你目前的身份？",type:"single",o:IDENT},
  ]},
 ]
}
};

const state={a:{},b:{}};
let current="a";
const needFill=(o)=>o.includes("其他（请注明）")||o.includes("其他");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderForm(key){
  const f=FORMS[key], root=document.getElementById("form"+key.toUpperCase());
  let html=`<div class="form-intro">${f.intro}`;
  if(f.compare){
    html+=`<div class="compare">
      <div class="cc"><b>版本 A · 极简</b>无需登录，打开只有一个呼吸球和「开始」按钮；仅保留计时、呼吸引导、人声引导、自然声音、本地记录；没有信息流、打卡、复杂任务，3 秒开始。</div>
      <div class="cc"><b>版本 B · 丰富</b>保留完整体系：30 天课程、7/15/30 三档课程、声音花园、多音混音、AI 陪伴小栖、练习档案、每日正念、脑机耳机入口等，内容更全但入口更多。</div>
    </div>`;
  }
  html+=`</div>`;
  f.sections.forEach(sec=>{
    html+=`<div class="sec-h">${sec.h}</div>`;
    sec.qs.forEach((q,i)=>{ html+=card(f,q,key); });
  });
  root.innerHTML=html;
}

function card(f,q,key){
  const required=q.req!==false;
  let body="";
  if(q.type==="single"||q.type==="multi"){
    const multi=q.type==="multi";
    body=`<div class="opts" data-q="${q.id}" data-form="${key}" data-multi="${multi}" data-max="${q.max||0}">`+
      q.o.map((op,idx)=>{
        const fill=op.includes("其他（请注明）");
        return `<div class="opt" onclick="pick(this)" data-val="${esc(op)}">
          <span class="box ${multi?'sq':''}"></span>
          <span class="ot">${esc(op.replace("（请注明）",""))}${fill?`<input class="fillin" style="display:none" placeholder="请填写" onclick="event.stopPropagation()" oninput="fillOther(this,'${q.id}','${key}')">`:""}</span>
        </div>`;
      }).join("")+`</div>`;
    if(multi&&q.max) body+=`<div class="tip">最多选择 ${q.max} 项</div>`;
  } else if(q.type==="scale"){
    body=`<div class="scale" data-q="${q.id}" data-form="${key}">`+
      [1,2,3,4,5].map(n=>`<div class="s" onclick="pickScale(this,'${q.id}','${key}',${n})"><span class="n">${n}</span></div>`).join("")+
      `</div><div class="scale-lbl"><span>${q.l}</span><span>${q.r}</span></div>`;
  } else if(q.type==="matrix"){
    body=`<div class="matrix-wrap"><table class="matrix"><thead><tr><th></th>${q.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`+
      q.rows.map((row,ri)=>`<tr><td>${esc(row)}</td>${q.cols.map((c,ci)=>`<td><span class="mbtn" onclick="pickMtx(this,'${q.id}','${key}',${ri},${ci})"></span></td>`).join("")}</tr>`).join("")+
      `</tbody></table></div>`;
  } else if(q.type==="open"){
    body=`<textarea data-q="${q.id}" data-form="${key}" oninput="state['${key}']['${q.id}']=this.value;updateProgress();" placeholder="请填写…"></textarea>`;
  }
  const gno=q.id.slice(1).replace(/^0+/,"");
  return `<div class="qcard" id="card-${q.id}">
    <div class="qtitle"><span class="qno">${gno}.</span>${q.t}</div>
    <div class="qmeta">${typeName(q.type)} ${required?'· <span class="req">必答</span>':''}</div>
    ${body}
  </div>`;
}
function typeName(t){return {single:"单选",multi:"多选",scale:"评分",matrix:"矩阵单选",open:"填空"}[t]||"";}

function pick(el){
  const wrap=el.parentElement, multi=wrap.dataset.multi==="true", max=+wrap.dataset.max,
        qid=wrap.dataset.q, key=wrap.dataset.form;
  const fillIn=el.querySelector(".fillin");
  if(multi){
    const sel=wrap.querySelectorAll(".opt.sel");
    if(el.classList.contains("sel")){ el.classList.remove("sel"); if(fillIn)fillIn.style.display="none"; }
    else{ if(max&&sel.length>=max){alert("最多选择 "+max+" 项");return;} el.classList.add("sel"); if(fillIn){fillIn.style.display="inline-block";fillIn.focus();} }
  }else{
    wrap.querySelectorAll(".opt").forEach(o=>{
      o.classList.remove("sel"); const fi=o.querySelector(".fillin"); if(fi){fi.style.display="none";fi.value="";}
    });
    el.classList.add("sel"); if(fillIn)fillIn.style.display="inline-block";
  }
  collect(key);
  updateProgress();
}
function fillOther(inp,qid,key){
  // 把“其他”文本并入：用 __OTHER__ 记录
  const f=state[key]["__other__"]||{};
  f[qid]=inp.value; state[key]["__other__"]=f;
  collect(key);
  updateProgress();
}
function pickScale(el,qid,key,n){
  el.parentElement.querySelectorAll(".s").forEach(s=>s.classList.remove("sel"));
  el.classList.add("sel"); state[key][qid]=n; updateProgress();
}
function pickMtx(el,qid,key,ri,ci){
  const tr=el.closest("tr");
  tr.querySelectorAll(".mbtn").forEach(b=>b.classList.remove("sel"));
  el.classList.add("sel");
  const arr=state[key][qid]||[]; arr[ri]=ci; state[key][qid]=arr;
  updateProgress();
}
function collect(key){
  const f=FORMS[key];
  const data={};
  f.sections.forEach(sec=>sec.qs.forEach(q=>{
    if(q.type==="single"||q.type==="multi"){
      const wrap=document.querySelector(`.opts[data-q="${q.id}"]`); if(!wrap)return;
      const vals=[...wrap.querySelectorAll(".opt.sel")].map(o=>o.dataset.val);
      const otherF=(state[key]["__other__"]||{})[q.id];
      let vals2=vals.map(v=> v==="其他（请注明）" && otherF? "其他："+otherF : v);
      if(q.type==="single") data[q.id]=vals2[0]||"";
      else data[q.id]=vals2;
    } else if(q.type==="open"){
      data[q.id]=state[key][q.id]||"";
    } else if(q.type==="scale"){
      data[q.id]=state[key][q.id]||"";
    } else if(q.type==="matrix"){
      data[q.id]=state[key][q.id]||[];
    }
  }));
  state[key]["__data__"]=data;
}
function progressOf(key){
  const f=FORMS[key]; let total=0,done=0;
  f.sections.forEach(sec=>sec.qs.forEach(q=>{
    if(q.req===false)return; total++;
    collect(key);
    const d=state[key]["__data__"][q.id];
    if(Array.isArray(d)){
      if(q.type==="matrix"){ if(d.filter(x=>x!==undefined).length>=q.rows.length) done++; }
      else if(d.length>0) done++;
    } else if(d!==undefined&&d!=="") done++;
  }));
  return {done,total,pct:Math.round(done/total*100)};
}
function updateProgress(){
  const p=progressOf(current);
  document.getElementById("pbar").style.width=p.pct+"%";
  document.getElementById("ptext").textContent=p.pct+"%";
}
function switchForm(key){
  current=key;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.form===key));
  document.getElementById("formA").classList.toggle("hidden",key!=="a");
  document.getElementById("formB").classList.toggle("hidden",key!=="b");
  document.getElementById("doneA").classList.toggle("hidden",!(key==="a"&&state.a.__done));
  document.getElementById("doneB").classList.toggle("hidden",!(key==="b"&&state.b.__done));
  document.getElementById("submitbar").style.display=(state[key].__done)?"none":"block";
  updateProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}
function findFirstMissing(key){
  const f=FORMS[key]; collect(key);
  for(const sec of f.sections) for(const q of sec.qs){
    if(q.req===false)continue;
    const d=state[key]["__data__"][q.id], card=document.getElementById("card-"+q.id);
    let miss=false;
    if(Array.isArray(d)){ if(q.type=="matrix") miss=d.filter(x=>x!==undefined).length<q.rows.length; else miss=d.length===0; }
    else miss=(d===undefined||d==="");
    if(miss){ card.classList.add("req-miss"); return card; } else card.classList.remove("req-miss");
  }
  return null;
}
function textSummary(key){
  const f=FORMS[key], d=state[key]["__data__"];
  let out=(key==="a"?"【问卷一·通用偏好】":"【栖改版取舍】")+"\n提交时间："+new Date().toLocaleString()+"\n";
  f.sections.forEach(sec=>{
    out+="\n"+sec.h+"\n";
    sec.qs.forEach(q=>{
      let v=d[q.id];
      if(q.type==="matrix"){
        v=(v||[]).map((ci,ri)=>`  · ${q.rows[ri]} → ${ci===undefined?"未选":q.cols[ci]}`).join("\n");
        out+=`${q.id.slice(1)} ${q.t}\n${v}\n`;
      } else if(Array.isArray(v)){
        out+=`${q.id.slice(1)} ${q.t} ${v.join("、")||"（未填）"}\n`;
      } else {
        out+=`${q.id.slice(1)} ${q.t} ${v||"（未填）"}\n`;
      }
    });
  });
  return out;
}
async function submitForm(){
  const key=current; collect(key);
  const miss=findFirstMissing(key);
  if(miss){
    document.getElementById("missingTip").style.display="block";
    miss.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>document.getElementById("missingTip").style.display="none",4000);
    return;
  }
  const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent="提交中…";
  const payload={form:key, ts:new Date().toISOString(), answers:state[key]["__data__"]};
  // 本地始终存一份
  try{
    const key2="roost_survey_"+key;
    const arr=JSON.parse(localStorage.getItem(key2)||"[]");
    arr.push(payload); localStorage.setItem(key2,JSON.stringify(arr));
  }catch(e){}
  let ok=true;
  if(FORM_ENDPOINT){
    try{
      const fd=new FormData();
      fd.append("_subject", key==="a"?"【栖ROOST】问卷一 · 通用偏好 · 新提交":"【栖ROOST】问卷二 · 栖改版取舍 · 新提交");
      fd.append("_template","table");
      fd.append("问卷",key==="a"?"问卷一·通用偏好":"问卷二·栖改版");
      fd.append("提交时间",new Date().toLocaleString());
      const d=payload.answers;
      FORMS[key].sections.forEach(sec=>sec.qs.forEach(q=>{
        let v=d[q.id];
        if(Array.isArray(v)){ v=q.type==="matrix"?v.map((ci,ri)=>`${q.rows[ri]}→${ci===undefined?"未选":q.cols[ci]}`).join("；"):v.join("、"); }
        fd.append(`${q.id} ${q.t}`, v===""? "（未填）":String(v));
      }));
      const res=await fetch(FORM_ENDPOINT,{method:"POST",body:fd,headers:{Accept:"application/json"}});
      let j={}; try{j=await res.json();}catch(e){}
      if(!(res.ok&&j.success==="true")) ok=false;
    }catch(e){ ok=false; }
  }
  state[key].__done=true;
  showDone(key, ok);
  btn.disabled=false; btn.textContent="提交";
}
function showDone(key,online){
  document.getElementById("form"+key.toUpperCase()).classList.add("hidden");
  document.getElementById("submitbar").style.display="none";
  const box=document.getElementById("done"+key.toUpperCase());
  const summary=textSummary(key);
  box.classList.remove("hidden");
  box.innerHTML=`<div class="thanks"><div class="big">🌿</div><h2>提交成功，感谢你的反馈</h2>
    <p>${FORM_ENDPOINT?(online?"你的回答已记录，会帮助我们把产品做得更好。":"已保存。若网络未同步，可复制下面的内容发给发布者。"):"你的回答已保存到本机。小范围调研可点击下方按钮复制后发给发布者。"}</p>
    <div class="copybox" id="copybox">${esc(summary)}</div>
    <button class="btn ghost" onclick="copyResult('${key}')">复制我的作答</button>
    <button class="btn" style="margin-left:10px" onclick="restart('${key}')">再填一次 / 切换问卷</button>
  </div>`;
  window.scrollTo(0,0);
}
function copyResult(key){
  const t=textSummary(key);
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>alert("已复制，可粘贴发送")); }
  else{ const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();alert("已复制"); }
}
function restart(key){
  state[key]={};
  renderForm(key);
  document.getElementById("done"+key.toUpperCase()).classList.add("hidden");
  document.getElementById("form"+key.toUpperCase()).classList.remove("hidden");
  document.getElementById("submitbar").style.display="block";
  switchForm(key);
}
// 研究者本机查看：?admin
function adminView(){
  if(!location.search.includes("admin"))return;
  const a=JSON.parse(localStorage.getItem("roost_survey_a")||"[]");
  const b=JSON.parse(localStorage.getItem("roost_survey_b")||"[]");
  let out=`<div class="form-intro"><b>当前设备本机备份</b><br>问卷一 ${a.length} 份 ｜ 问卷二 ${b.length} 份。
   在线收集已配置：每次提交都会自动发送到你绑定的邮箱；这里是本机备份，可导出 CSV。
   <br><button class="btn ghost" style="margin-top:10px" onclick="exportAdmin()">导出台账 (CSV)</button>
   <button class="btn ghost" style="margin-top:10px" onclick="localStorage.clear();location.reload()">清空本机记录</button></div>`;
  document.querySelector(".tabs").insertAdjacentHTML("afterend",out);
}
function exportAdmin(){
  const rows=[];
  ["a","b"].forEach(k=>{
    const arr=JSON.parse(localStorage.getItem("roost_survey_"+k)||"[]");
    arr.forEach(p=>{
      const r={问卷:k,时间:p.ts};
      FORMS[k].sections.forEach(s=>s.qs.forEach(q=>{
        let v=p.answers[q.id];
        if(Array.isArray(v)) v=q.type==="matrix"?v.map((ci,ri)=>`${q.rows[ri]}→${q.cols[ci]}`).join("；"):v.join("、");
        r[q.id+" "+q.t]=v;
      }));
      rows.push(r);
    });
  });
  if(!rows.length){alert("本机暂无记录");return;}
  const keys=Object.keys(rows[0]);
  const csv="\ufeff"+keys.join(",")+"\n"+rows.map(r=>keys.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="冥想App调研台账.csv";a.click();
}

renderForm("a");renderForm("b");switchForm("a");adminView();
</script>
