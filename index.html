<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, initial-scale=1.0">
<title>栖 ROOST — 诗意地栖居</title>

<style>
  :root{
    /* 浅色自然系 —— 潮汐式暖纸白 + 鼠尾草绿 + 雾蓝 */
    --bg:#F3F1EB;
    --bg-soft:#ECE9E1;
    --card:#FFFFFF;
    --line:#E7E3D9;
    --ink:#2C3330;
    --ink-dim:#7D837C;
    --ink-faint:#B0B5AC;
    --sage:#8FAE9A;
    --sage-deep:#6E8F7B;
    --sage-tint:#EDF3EE;
    --mist:#9DB8C4;
    --mist-tint:#ECF2F4;
    --clay:#D4A98C;
    --clay-tint:#F7EFE8;
    --shadow:0 10px 40px rgba(70,80,70,0.07);
    --shadow-soft:0 4px 18px rgba(70,80,70,0.05);
    /* 冥想夜色 */
    --night:#151D30;
    --night-2:#1C2640;
    --night-line:#2B3756;
    --night-ink:#EAEDEF;
    --night-dim:#8E99B0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif;overflow:hidden;}
  .serif{font-family:'Noto Serif SC',serif;}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  button{font-family:inherit;}

  .view{display:none;height:100%;flex-direction:column;}
  .view.active{display:flex;}

  /* ===== 底部 Tab ===== */
  .tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    display:none;justify-content:space-around;align-items:center;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(243,241,235,0.9);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
  }
  .tabbar.show{display:flex;}
  .tabbar button{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;padding:6px 14px;
  }
  .tabbar button.on{color:var(--sage-deep);}
  .tabbar svg{width:22px;height:22px;}

  .pad{padding:26px 22px 110px;overflow-y:auto;height:100%;}
</style>
</head>
<body>

<!-- 底部Tab栏 -->
<nav class="tabbar" id="tabbar">
  <button data-view="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
    首页
  </button>
  <button data-view="courses">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    课程
  </button>
  <button data-view="sounds">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>
    声音花园
  </button>
  <button data-view="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
    我的
  </button>
</nav>

<!-- 首页 -->
<section class="view active" id="view-home">
  <div class="pad">
    <h1 class="serif" style="font-size:32px;font-weight:400;line-height:1.3;margin-bottom:8px;">栖 ROOST</h1>
    <p style="color:var(--ink-dim);font-size:14px;margin-bottom:32px;">让身体在世界上诗意地栖息</p>
    
    <!-- 每日正念 -->
    <div style="background:var(--card);border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:var(--shadow-soft);">
      <p style="font-size:12px;color:var(--ink-faint);margin-bottom:8px;">今日正念</p>
      <p class="serif" style="font-size:18px;line-height:1.6;color:var(--ink);" id="daily-quote">呼吸，是身体和心灵之间最短的距离。</p>
    </div>

    <!-- 今日练习卡片 -->
    <div style="background:linear-gradient(135deg,var(--sage-tint),var(--mist-tint));border-radius:20px;padding:28px;margin-bottom:24px;">
      <p style="font-size:13px;color:var(--ink-dim);margin-bottom:8px;">今日练习</p>
      <h2 class="serif" style="font-size:24px;font-weight:400;margin-bottom:16px;">Day 1 · 安顿下来</h2>
      <button id="start-today-btn" style="width:100%;padding:14px;border:none;border-radius:12px;background:var(--sage-deep);color:#fff;font-size:15px;cursor:pointer;">开始练习</button>
    </div>

    <!-- 快速入口 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <button data-view="courses" style="padding:20px;background:var(--card);border:none;border-radius:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow-soft);">
        <p style="font-size:13px;color:var(--ink-dim);">课程</p>
        <p style="font-size:16px;margin-top:4px;">30天正念</p>
      </button>
      <button data-view="sounds" style="padding:20px;background:var(--card);border:none;border-radius:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow-soft);">
        <p style="font-size:13px;color:var(--ink-dim);">声音</p>
        <p style="font-size:16px;margin-top:4px;">声音花园</p>
      </button>
    </div>
  </div>
</section>

<!-- 课程页 -->
<section class="view" id="view-courses">
  <div class="pad">
    <h2 class="serif" style="font-size:28px;font-weight:400;margin-bottom:24px;">课程</h2>
    <div id="course-list"></div>
  </div>
</section>

<!-- 声音花园页 -->
<section class="view" id="view-sounds">
  <div class="pad">
    <h2 class="serif" style="font-size:28px;font-weight:400;margin-bottom:24px;">声音花园</h2>
    <p style="color:var(--ink-dim);font-size:14px;margin-bottom:20px;">选择你喜欢的背景音，冥想时会自动播放</p>
    <div id="sounds-list"></div>
  </div>
</section>

<!-- 我的页 -->
<section class="view" id="view-profile">
  <div class="pad">
    <h2 class="serif" style="font-size:28px;font-weight:400;margin-bottom:24px;">我的</h2>
    <div style="background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow-soft);margin-bottom:16px;">
      <p style="font-size:14px;color:var(--ink-dim);">已完成练习</p>
      <p style="font-size:24px;margin-top:8px;"><span id="completed-days">0</span> 天</p>
    </div>
    <div style="background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow-soft);">
      <p style="font-size:14px;color:var(--ink-dim);">累计冥想时长</p>
      <p style="font-size:24px;margin-top:8px;"><span id="total-minutes">0</span> 分钟</p>
    </div>
  </div>
</section>

<!-- 冥想播放页 -->
<section class="view" id="view-meditation">
  <div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;">
    <div id="breath-circle" style="width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--sage) 0%,var(--sage-tint) 100%);margin-bottom:40px;transition:transform 4s ease-in-out;"></div>
    <h2 id="meditation-title" class="serif" style="font-size:22px;font-weight:400;margin-bottom:8px;">Day 1 · 安顿下来</h2>
    <p id="meditation-subtitle" style="color:var(--ink-dim);font-size:14px;margin-bottom:32px;">第 1 / 5 段 · 全程约15分钟</p>
    <button id="pause-btn" style="width:64px;height:64px;border-radius:50%;border:none;background:var(--card);box-shadow:var(--shadow-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;">
      <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button id="exit-btn" style="margin-top:32px;background:none;border:none;color:var(--ink-dim);font-size:14px;cursor:pointer;">退出练习</button>
  </div>
</section>

<script>
// 视图切换
function switchView(viewId){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+viewId).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('on'));
  document.querySelector(`.tabbar button[data-view="${viewId}"]`)?.classList.add('on');
  if(viewId !== 'meditation'){
    document.getElementById('tabbar').classList.add('show');
  }else{
    document.getElementById('tabbar').classList.remove('show');
  }
}

document.querySelectorAll('.tabbar button, [data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const view = btn.dataset.view;
    if(view) switchView(view);
  });
});

// 每日正念语句
const quotes = [
  "呼吸，是身体和心灵之间最短的距离。",
  "冥想不是清空大脑，只是温柔地回来。",
  "此刻，你只需要呼吸。",
  "安静下来，才能听见内心的声音。",
  "每一次呼吸，都是一次重新开始。"
];
function setDailyQuote(){
  const today = new Date();
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(),0,0)) / 86400000);
  document.getElementById('daily-quote').textContent = quotes[dayOfYear % quotes.length];
}
setDailyQuote();

// 今日练习按钮
document.getElementById('start-today-btn').addEventListener('click', ()=>{
  startSession(1);
});

// 简单的练习状态
let session = {
  currentDay: 1,
  isPlaying: false,
  audio: null
};

function startSession(day){
  session.currentDay = day;
  session.isPlaying = true;
  document.getElementById('meditation-title').textContent = `Day ${day} · 安顿下来`;
  switchView('meditation');
  document.dispatchEvent(new Event('roostMeditationStart'));
}

function endSession(){
  session.isPlaying = false;
  document.dispatchEvent(new Event('roostMeditationEnd'));
  switchView('home');
}

document.getElementById('exit-btn').addEventListener('click', endSession);

document.getElementById('pause-btn').addEventListener('click', ()=>{
  const icon = document.getElementById('pause-icon');
  if(session.isPlaying){
    session.isPlaying = false;
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }else{
    session.isPlaying = true;
    icon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  }
});

// 呼吸圆圈动画
const breathCircle = document.getElementById('breath-circle');
function animateBreath(){
  if(session.isPlaying){
    breathCircle.style.transform = 'scale(1.2)';
    setTimeout(()=>{
      breathCircle.style.transform = 'scale(1)';
    }, 4000);
  }
}
setInterval(animateBreath, 8000);
</script>

<script src="upgrade.js"></script>
<script src="features.js"></script>
<script src="mix-store.js"></script>
<script src="sound-studio.js"></script>
<script src="course-tracks.js"></script>
<script src="./xiaoxi.js"></script>
</body>
</html>
